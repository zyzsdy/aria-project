[workspace]
members = [
    "apps/aria-cli",
    "apps/aria-daemon",
    "apps/aria-desktop/src-tauri",
    "crates/aria-core",
    "crates/aria-ipc",
    "crates/aria-model",
    "crates/aria-session",
    "crates/aria-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["Aria contributors"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
tauri-build = { version = "2.0", features = [] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
portable-pty = "0.9"
vt100 = "0.16"
